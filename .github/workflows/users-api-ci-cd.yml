
name: UsersAPI CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/FCG.UsersAPI.Tests/FCG.UsersAPI.Tests.csproj --configfile NuGet.config

      - name: Build
        run: dotnet build tests/FCG.UsersAPI.Tests/FCG.UsersAPI.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/FCG.UsersAPI.Tests/FCG.UsersAPI.Tests.csproj --configuration Release --no-build --no-restore

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FCG.UsersAPI/Dockerfile
          push: false
          tags: fcg-users-api:${{ github.sha }}
