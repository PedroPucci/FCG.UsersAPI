apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
spec:
  replicas: 1

  selector:
    matchLabels:
      app: users-api

  template:
    metadata:
      labels:
        app: users-api

    spec:
      containers:
        - name: users-api
          image: pedroighor2/fcg-users-api:1.0

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: users-api-config

            - secretRef:
                name: users-api-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"